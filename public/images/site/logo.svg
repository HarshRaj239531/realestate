<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Architectural Luxury Home Icon -->
  <g transform="translate(18, 14)">
    <!-- Roof Peak -->
    <path d="M 26,4 L 48,22 L 42,22 L 26,9 L 10,22 L 4,22 Z" fill="url(#emeraldGrad)" />
    <!-- Chimney / Modern accent line -->
    <rect x="36" y="8" width="4" height="8" fill="#10b981" rx="1" />
    <!-- Building Pillars & Eco Arch -->
    <rect x="8" y="25" width="6" height="24" rx="2" fill="url(#navyGrad)" />
    <rect x="18" y="25" width="6" height="24" rx="2" fill="url(#navyGrad)" />
    <rect x="28" y="25" width="6" height="24" rx="2" fill="url(#navyGrad)" />
    <rect x="38" y="25" width="6" height="24" rx="2" fill="url(#navyGrad)" />
    <!-- Base Foundation bar -->
    <rect x="4" y="51" width="44" height="4" rx="2" fill="url(#emeraldGrad)" />
    <!-- Central Leaf Symbol -->
    <path d="M 26,17 C 32,23 31,31 26,35 C 21,31 20,23 26,17 Z" fill="#10b981" opacity="0.9" />
  </g>

  <!-- Typography -->
  <g transform="translate(80, 42)">
    <text x="0" y="0" font-family="'Instrument Sans', 'Montserrat', 'Inter', system-ui, sans-serif" font-weight="900" font-size="26" letter-spacing="-0.5" fill="#0f172a">
      Real<tspan fill="#2f9049">Estate</tspan>
    </text>
    <text x="2" y="18" font-family="'Instrument Sans', system-ui, sans-serif" font-weight="700" font-size="9" letter-spacing="3.5" fill="#64748b">
      LUXURY &amp; ECO LIVING
    </text>
  </g>
</svg>
