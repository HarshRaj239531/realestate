<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e5aa8" />
      <stop offset="100%" stop-color="#0e3d7a" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e02e24" />
      <stop offset="100%" stop-color="#b81e15" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00a896" />
      <stop offset="100%" stop-color="#028090" />
    </linearGradient>
  </defs>

  <!-- Stylized A & G Monogram -->
  <g transform="translate(18, 6)">
    <!-- Outer G arc / curve -->
    <path d="M 32,4 C 16,4 4,16 4,32 C 4,48 16,60 32,60 C 46,60 56,51 59,38 L 47,38 C 45,44 39,49 32,49 C 22,49 15,41 15,32 C 15,22 22,15 32,15 C 38,15 44,19 47,24 L 58,18 C 52,9 43,4 32,4 Z" fill="url(#blueGrad)" />
    
    <!-- Stylized A peak inside -->
    <polygon points="32,8 21,38 29,38 32,28 35,38 43,38" fill="url(#blueGrad)" />
    <polygon points="32,17 28,30 36,30" fill="#ffffff" />
    
    <!-- Red & Cyan accent bar -->
    <rect x="23" y="32" width="9" height="4" fill="url(#redGrad)" rx="1" />
    <rect x="32" y="32" width="16" height="4" fill="url(#cyanGrad)" rx="1" />
  </g>

  <!-- Typography -->
  <g transform="translate(85, 33)">
    <text x="0" y="0" font-family="'Instrument Sans', 'Montserrat', 'Inter', system-ui, sans-serif" font-weight="900" font-size="21" letter-spacing="0.5" fill="#18202d">
      AG HOMES
    </text>
    <text x="114" y="0" font-family="'Instrument Sans', 'Montserrat', 'Inter', system-ui, sans-serif" font-weight="900" font-size="21" letter-spacing="0.5" fill="#c92a2a">
      INDIA
    </text>
    <text x="1" y="16" font-family="'Instrument Sans', system-ui, sans-serif" font-weight="600" font-size="8.5" letter-spacing="3.2" fill="#5c7cfa" opacity="0.95">
      ECO LUXURY LIVING
    </text>
  </g>
</svg>
